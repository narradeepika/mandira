spring.application.name=dhabaleswara-temple
server.port=8080

# ---------- DATABASE (MySQL) ----------
# The database is created automatically (createDatabaseIfNotExist=true).
# Override with environment variables if you like: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dhabaleswar_mandira?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Asmita1234@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- WEBSITE ADMIN LOGIN (created on first start only) ----------
# This is NOT the MySQL login. Use a different username/password from the database one.
# After the first login, change the password in Admin -> Change Password.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---------- SECURITY ----------
app.security.max-failed-attempts=5
app.security.lock-minutes=15
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when you serve the site over HTTPS
server.servlet.session.cookie.secure=false

spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never