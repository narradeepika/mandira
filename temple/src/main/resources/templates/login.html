<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Login')}"></head>
<body class="login-body">
  <main class="login-card">
    <h1>🕉 Temple Admin</h1>
    <p class="muted">Sri Sri Baba Dhabaleswar Mandira</p>
    <div class="alert alert-error" th:if="${param.error}">Invalid username or password, or the account is temporarily locked.</div>
    <div class="alert alert-ok" th:if="${param.logout}">You have been logged out.</div>
    <form th:action="@{/login}" method="post">
      <label>Username<input type="text" name="username" required autofocus autocomplete="username"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <a th:href="@{/}" class="muted back">← Back to website</a>
  </main>
</body>
</html>
