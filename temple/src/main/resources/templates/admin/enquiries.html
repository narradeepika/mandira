<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Enquiries')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{admin/fragments :: sidebar}"></aside>
  <main class="content">
    <h1>Enquiries</h1>
    <div class="alert alert-ok" th:if="${msg}" th:text="${msg}"></div>
    <form method="get" th:action="@{/admin/enquiries}" class="search">
      <input type="search" name="q" th:value="${q}" placeholder="Search name, email, subject, message">
      <button class="btn" type="submit">Search</button>
    </form>
    <table>
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Subject</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr th:each="e : ${page.content}">
          <td th:text="${#temporals.format(e.createdAt, 'dd MMM yyyy HH:mm')}"></td>
          <td th:text="${e.name}"></td>
          <td th:text="${e.email}"></td>
          <td th:text="${e.phone}"></td>
          <td th:text="${e.subject}"></td>
          <td><span class="pill" th:classappend="${e.resolved} ? 'pill-ok' : 'pill-open'" th:text="${e.resolved} ? 'Resolved' : 'Open'"></span></td>
          <td><a th:href="@{/admin/enquiries/{id}(id=${e.id})}">View</a></td>
        </tr>
        <tr th:if="${page.empty}"><td colspan="7" class="muted">No enquiries found.</td></tr>
      </tbody>
    </table>
    <div class="pager">
      <a th:if="${page.hasPrevious()}" th:href="@{/admin/enquiries(q=${q}, page=${page.number - 1})}">← Previous</a>
      <span>Page <b th:text="${page.number + 1}">1</b> of <b th:text="${page.totalPages == 0 ? 1 : page.totalPages}">1</b></span>
      <a th:if="${page.hasNext()}" th:href="@{/admin/enquiries(q=${q}, page=${page.number + 1})}">Next →</a>
    </div>
  </main>
</div>
</body>
</html>
