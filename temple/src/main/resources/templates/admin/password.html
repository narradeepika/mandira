<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Change Password')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{admin/fragments :: sidebar}"></aside>
  <main class="content">
    <h1>Change password</h1>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/admin/password}" method="post" class="card form">
      <label>Current password<input type="password" name="current" required autocomplete="current-password"></label>
      <label>New password (min 10 characters)<input type="password" name="newPassword" minlength="10" required autocomplete="new-password"></label>
      <label>Confirm new password<input type="password" name="confirm" minlength="10" required autocomplete="new-password"></label>
      <div class="actions"><button class="btn" type="submit">Update password</button></div>
    </form>
  </main>
</div>
</body>
</html>
